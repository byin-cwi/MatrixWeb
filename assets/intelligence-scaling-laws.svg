  <g font-family="Chalkboard, 'Comic Sans MS', 'Segoe Print', sans-serif" font-weight="500" letter-spacing="1.5">
    <text x="302" y="164" fill="#f4f4f1" font-size="44">FROM ONE TO THREE</text>
    <text x="356" y="214" fill="#f4f4f1" font-size="44">SCALING LAWS</text>
    <text x="72" y="420" fill="#f4f4f1" font-size="31">“INTELLIGENCE”</text>
    <text x="738" y="818" fill="#f4f4f1" font-size="32">COMPUTE</text>
    <text x="540" y="632" fill="#78bb2d" font-size="36">PRE-TRAINING SCALING</text>
    <text x="808" y="408" fill="#78bb2d" font-size="38">POST-TRAINING SCALING</text>
    <text x="1060" y="236" fill="#78bb2d" font-size="37">TEST-TIME SCALING</text>
    <text x="1080" y="282" fill="#78bb2d" font-size="35">“LONG THINKING”</text>
  </g>
</svg>
