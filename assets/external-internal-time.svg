<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="900" viewBox="0 0 2200 900" role="img" aria-labelledby="title desc">
  <title id="title">External time and internal time in neural networks</title>
  <desc id="desc">A dark timeline diagram contrasting dense external time ticks with sparse internal updates and changing neural subnetworks.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0" stop-color="#07161a"/>
      <stop offset="0.52" stop-color="#050708"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="timeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57d9e7" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#9cf6ff"/>
      <stop offset="1" stop-color="#57d9e7" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="pulseLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78d6ff"/>
      <stop offset=".5" stop-color="#34ffe2"/>
      <stop offset="1" stop-color="#69c7ff"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.14 0 0 0 0 0.95 0 0 0 0 0.95 0 0 0 .75 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label{font:500 38px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#5ad5e2}
      .muted{fill:#5c6266;opacity:.72}
      .tick{stroke:#5cdce8;stroke-width:3;opacity:.8}
      .minor{stroke:#5cdce8;stroke-width:2;opacity:.55}
      .netLine{stroke:#6f828a;stroke-width:2;opacity:.55}
      .activeLine{stroke:#7bdfff;stroke-width:3;opacity:.9;filter:url(#glow)}
      .node{fill:#59666d;opacity:.72}
      .activeNode{fill:#4ff4ef;filter:url(#glow)}
    </style>
  </defs>

  <rect width="2200" height="900" fill="url(#bgGlow)"/>
  <rect width="2200" height="900" fill="#000" opacity=".32"/>

